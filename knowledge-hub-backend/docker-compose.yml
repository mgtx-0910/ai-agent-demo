# ============================================================
# 本地开发依赖：Postgres（元数据）+ MongoDB（正文）+ 两个 Web GUI
# 只起数据库与 GUI，Node 服务在宿主机上用 pnpm start:dev 跑（热重载更方便）
#
# 启动：docker compose up -d
# 数据落在 ./volumes（已在 .gitignore 中忽略），删掉该目录即可重置全部数据，
# init-scripts 也只会在数据卷为空时执行。
# ============================================================

services:
  # PostgreSQL（带 pgvector 扩展，为后续向量检索预留）
  postgres:
      image: pgvector/pgvector:pg16
      container_name: knowledge_hub_postgres
      restart: always
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: 123456
        POSTGRES_DB: knowledge_hub
      ports:
        # 宿主机端口走变量，默认 15432，可被 .env 的 POSTGRES_PORT 覆盖，两边天然同源。
        # 不用 5432 的原因：该端口常被本机其它项目的 Postgres 容器占用（如 langfuse-test-postgres-1），
        # 一旦被占，报错是 "Bind for 0.0.0.0:5432 failed: port is already allocated"，
        # 且会顺着 depends_on 把 pgadmin / mongo-express 一起拖住不起。
        # 容器内端口始终是 5432（postgres 服务间互访用它），应用连的是宿主机端口。
        - "${POSTGRES_PORT:-15432}:5432"
      volumes:
        - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
        # 建库建表脚本，仅首次初始化（空数据卷）时执行
        - ./init-scripts/postgresql:/docker-entrypoint-initdb.d
      healthcheck:
        # pg_isready 只探测「服务能否响应」，并不会校验库名是否存在，
        # 所以这里写 hello_pg 也不会导致 unhealthy（仅会在 PG 日志里留下失败连接记录）。
        # 想干净些可改成 -d knowledge_hub
        test: ["CMD-SHELL", "pg_isready -U user -d hello_pg"]
        interval: 5s
        timeout: 5s
        retries: 5

  # PostgreSQL GUI（pgAdmin）：http://localhost:8088
  pgadmin:
    container_name: knowledge_hub_pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/pgadmin:/var/lib/pgadmin
    healthcheck:
      # 该镜像里只有 busybox 的 wget、没有 curl（容器内 `command -v curl` 为空），
      # 用 curl 探测必然失败 → 服务明明是好的（/login 返回 200），状态却一直是 unhealthy。
      # 换成 /misc/ping（pgAdmin 自带的健康端点，返回 PING），并给启动期留 start_period。
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    ports:
      - "8088:80"
    depends_on:
      - postgres

  # MongoDB 主库（元数据之外的所有正文都在这）
  mongodb:
    image: mongo:7-jammy
    container_name: knowledge_hub_mongodb
    restart: always
    environment:
      # 容器管理员账号（mongo-express 与初始化脚本用；应用连接串用的是低权限的 knowledge_hub_user）
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass123
      MONGO_INITDB_DATABASE: knowledge_hub
    ports:
      # 同理：本机若已有 27017 在监听，改成 "27017:27017" 以外的端口并同步 .env 的 MONGO_URI
      - "27017:27017"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/mongo:/data/db
      - ./init-scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "mongo_user", "-p", "mongo_pass123", "--authenticationDatabase", "admin"]
      interval: 10s
      timeout: 10s
      retries: 5
      # mongosh 冷启动本身要几秒，启动阶段探测很容易连着失败把 retries 耗尽而被判 unhealthy；
      # 一旦被判 unhealthy，依赖 service_healthy 的 mongo-express 会直接放弃启动并报
      # "dependency failed to start: container knowledge_hub_mongodb is unhealthy"。
      # start_period 内的失败不计入 retries，可消除这种启动竞态（容器起来后仍会正常判健康）。
      start_period: 30s

  # MongoDB Web GUI：http://localhost:8081
  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: knowledge_hub_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      # ⚠️ 必须显式覆盖 ME_CONFIG_MONGODB_URL
      # 镜像自带 ENV `ME_CONFIG_MONGODB_URL=mongodb://mongo:27017`，而它一旦非空就会**优先于**
      # ME_CONFIG_MONGODB_SERVER / ADMINUSERNAME / ADMINPASSWORD 生效：本项目服务名是 mongodb 而非 mongo，
      # 于是日志里会一直刷 `mongo: Name does not resolve`，页面能打开却连不上库。
      ME_CONFIG_MONGODB_URL: "mongodb://mongo_user:mongo_pass123@mongodb:27017/?authSource=admin"
      # —— 第一组账号：mongo-express 连 MongoDB 用的（要和上面 mongodb 服务一致）
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo_pass123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      # —— 第二组账号：浏览器打开 mongo-express 时的登录账号（与数据库账号无关）
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: me_admin
      ME_CONFIG_BASICAUTH_PASSWORD: me_123456
      # 编辑器暗色主题
      ME_CONFIG_OPTIONS_EDITORTHEME: "3024-night"
    # 等 mongodb 健康就绪再启动，避免起来后连不上
    depends_on:
      mongodb:
        condition: service_healthy

# 固定网络名：方便以后把 Node 服务也丢进容器，或用别的 compose 项目接入同一个网络
networks:
  default:
    name: common-network
